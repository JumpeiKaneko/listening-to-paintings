<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絵画を聴く</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color:#1f1f1f; background:#fafaf8; margin:0; padding:16px; }
  .brand { font-weight:700; font-size:1.1rem; margin:4px auto 12px; max-width:560px; }
  .card { max-width:560px; margin:0 auto 14px; background:#fff; border:1px solid #e3e3e0; border-radius:12px; padding:16px; box-sizing:border-box; }
  .pill { border:1px solid #bbb; background:#fff; color:#1f1f1f; border-radius:999px; padding:12px 10px; font-size:1rem; }
  .pill.solid { background:#1f1f1f; color:#fff; border-color:#1f1f1f; }
  .wide { display:block; width:100%; margin-top:12px; }
  .picture { display:block; width:100%; border-radius:8px; margin-top:10px; }
  .small { font-size:.86rem; } .muted { color:#6b6f73; } .title { display:block; font-weight:700; }
  :root { --rule:#e3e3e0; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .pill { flex: 1; text-align: center; }
  .pill.on { background: #1f1f1f; color: #fff; }
  #g { margin-top: 14px; font-size: 1.1rem; padding: 16px; }
  table.bt { width: 100%; border-collapse: collapse; font-size: .86rem; }
  table.bt td, table.bt th { border-bottom: 1px solid var(--rule); padding: 6px 4px; text-align: left; }
</style>
</head>
<body>
<div class="brand"><span>絵画を聴く</span></div>
<section class="card">
  <p class="small muted">この周の条件</p>
  <div class="row">
    <button class="pill" data-c="picture">絵のみ</button>
    <button class="pill" data-c="guide">ガイドあり</button>
    <button class="pill" data-c="all">ガイドと音あり</button>
  </div>
  <p id="caption" style="margin-top:14px">イヤホンをつけて「はじめる」を押し、絵に近づいてください。</p>
  <img id="picture" class="picture" alt="" hidden>
  <button id="b" class="pill solid wide">はじめる</button>
  <button id="g" class="pill wide" hidden>ガイドを聴く</button>
  <p id="pos" class="small muted"></p>
</section>
<section class="card" id="setup" hidden>
  <p class="small muted">見えているビーコン（強い順）</p>
  <table class="bt" id="seen"></table>
</section>
<p class="small muted" style="max-width:560px;margin:0 auto"><a href="#" id="toggle">ビーコンの確認</a></p>

<script>
  // MP3版：ビーコンで近くの絵を見つけ、その絵の音（書き出したMP3）をループで流す。向きのセンサーは使わない。
  const $ = (id) => document.getElementById(id);
  const WORKS = [
    { id: 'monet-beach-sainte-adresse-1867', beacon: 'iBeacon 9-48399', ad: 'mp3/ad1.mp3', t: 'クロード・モネ《サント＝アドレスの浜辺》', y: '1867　シカゴ美術館' },
    { id: 'pissarro-boulevard-montmartre-winter-1897', beacon: 'iBeacon 9-50449', ad: 'mp3/ad2.mp3', t: 'カミーユ・ピサロ《モンマルトル大通り、冬の朝》', y: '1897　メトロポリタン美術館' },
    { id: 'monet-gare-saint-lazare-1877', beacon: 'iBeacon 9-48394', ad: 'mp3/ad3.mp3', t: 'クロード・モネ《ノルマンディー線の列車の到着、サン＝ラザール駅》', y: '1877　シカゴ美術館' },
    { id: 'monet-stacks-of-wheat-1890', beacon: 'iBeacon 9-48409', ad: 'mp3/ad4.mp3', t: 'クロード・モネ《積みわら（夏の終わり）》', y: '1890–91　シカゴ美術館' },
    { id: 'degas-dance-class-1874', beacon: 'iBeacon 9-50448', ad: 'mp3/ad5.mp3', t: 'エドガー・ドガ《ダンス教室》', y: '1874　メトロポリタン美術館' },
    { id: 'caillebotte-paris-street-rainy-day-1877', beacon: 'iBeacon 9-48232', ad: 'mp3/ad6.mp3', t: 'ギュスターヴ・カイユボット《パリの通り、雨》', y: '1877　シカゴ美術館' }
  ];
  const NEAR = -80;        // これより弱いビーコンは無視
  const MARGIN = 6;        // 今の絵より何dB強ければ切り替え候補にするか
  const HOLD = 3000;       // 候補がこの時間続いたら切り替える（ミリ秒）
  const FADE = 2000;       // 切り替えのフェード（ミリ秒）
  const BG = 0.9, DUCK = 0.3;

  const IBEACON = 0x004C;
  function keyOf(ev) {
    const md = ev.manufacturerData && ev.manufacturerData.get(IBEACON);
    if (md && md.byteLength >= 23 && md.getUint8(0) === 0x02 && md.getUint8(1) === 0x15) return 'iBeacon ' + md.getUint16(18) + '-' + md.getUint16(20);
    if (ev.device && ev.device.name) return '名前 ' + ev.device.name;
    return null;
  }

  let cond = 'all';
  try { cond = localStorage.getItem('mp3cond') || 'all'; } catch (e) { }
  function paintCond() { document.querySelectorAll('[data-c]').forEach((b) => b.classList.toggle('on', b.dataset.c === cond)); }
  paintCond();

  const seen = new Map();   // key -> { ema, t }
  let cur = null, cand = null, candSince = 0, started = false;
  const bgA = new Audio(), bgB = new Audio(); bgA.loop = bgB.loop = true; bgA.preload = bgB.preload = 'auto';
  let bg = bgA;
  const ad = new Audio(); ad.preload = 'auto';
  let guiding = false;

  function ramp(a, to, ms, done) {
    const from = a.volume, t0 = performance.now();
    clearInterval(a._r);
    a._r = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) { clearInterval(a._r); if (done) done(); }
    }, 50);
  }
  const bgLevel = () => (guiding ? DUCK : BG);

  function applyCond() {
    // 条件に合わせて、背景の音とガイドのボタンを出し入れする
    const w = WORKS.find((x) => x.id === cur);
    $('g').hidden = !(w && cond !== 'picture');
    if (cond !== 'all' || !w) { ramp(bg, 0, 600, () => bg.pause()); }
    else { if (bg.paused) { bg.volume = 0; bg.play().catch(() => { }); } ramp(bg, bgLevel(), FADE); }
    if (cond === 'picture') stopGuide();
  }

  function enter(id) {
    const w = WORKS.find((x) => x.id === id);
    cur = id;
    stopGuide();
    $('caption').innerHTML = '<span class="title">' + w.t + '</span>' + w.y + (cond === 'picture' ? '<br>この周は、音なしでご覧ください。' : '');
    $('picture').src = 'works/' + id + '/image.jpg'; $('picture').hidden = false;
    $('picture').onerror = () => { $('picture').src = 'works/' + id + '/image.jpeg'; $('picture').onerror = null; };
    ad.src = w.ad;
    if (cond === 'all') {
      const old = bg, next = bg === bgA ? bgB : bgA;
      next.src = 'mp3/' + id + '.mp3'; next.volume = 0; next.currentTime = 0;
      next.play().catch(() => { });
      ramp(next, bgLevel(), FADE);
      ramp(old, 0, FADE, () => old.pause());
      bg = next;
    }
    applyCond();
  }

  function stopGuide() { ad.pause(); guiding = false; $('g').textContent = 'ガイドを聴く'; }
  $('g').addEventListener('click', () => {
    if (guiding) { stopGuide(); if (cond === 'all') ramp(bg, BG, 800); return; }
    guiding = true; $('g').textContent = 'ガイドを止める';
    ad.currentTime = 0; ad.play().catch(() => { });
    if (cond === 'all') ramp(bg, DUCK, 800);
  });
  ad.addEventListener('ended', () => { stopGuide(); if (cond === 'all') ramp(bg, BG, 1500); });

  document.querySelectorAll('[data-c]').forEach((b) => b.addEventListener('click', () => {
    cond = b.dataset.c; try { localStorage.setItem('mp3cond', cond); } catch (e) { }
    paintCond(); if (cur) enter(cur);
  }));
  $('toggle').addEventListener('click', (e) => { e.preventDefault(); $('setup').hidden = !$('setup').hidden; });

  function tick() {
    const now = Date.now();
    let best = null;
    for (const w of WORKS) {
      const v = seen.get(w.beacon);
      if (v && now - v.t < 4000 && v.ema > NEAR && (!best || v.ema > best.ema)) best = { id: w.id, ema: v.ema };
    }
    const curW = WORKS.find((x) => x.id === cur);
    const cv = curW && seen.get(curW.beacon);
    const curE = cv && now - cv.t < 4000 ? cv.ema : -120;
    if (best && best.id !== cur && (!cur || best.ema > curE + MARGIN)) {
      if (cand !== best.id) { cand = best.id; candSince = now; }
      else if (now - candSince >= (cur ? HOLD : 1000)) { cand = null; enter(best.id); }
    } else cand = null;
    $('pos').textContent = cur ? '' : (seen.size ? 'ビーコンは見えています。絵に近づいてください。' : 'ビーコンを探しています…');
    if (!$('setup').hidden) {
      $('seen').innerHTML = [...seen.entries()].filter(([, v]) => now - v.t < 4000).sort((a, c) => c[1].ema - a[1].ema).slice(0, 10)
        .map(([k, v]) => { const w = WORKS.find((x) => x.beacon === k); return '<tr><td>' + k + '</td><td>' + Math.round(v.ema) + ' dBm</td><td>' + (w ? w.t : '') + '</td></tr>'; }).join('');
    }
  }

  $('b').addEventListener('click', async () => {
    if (started) return;
    // タップの瞬間に再生の許可を得ておく
    [bgA, bgB, ad].forEach((a) => { a.muted = true; a.play().then(() => { a.pause(); a.muted = false; }).catch(() => { a.muted = false; }); });
    if (!(navigator.bluetooth && navigator.bluetooth.requestLEScan)) {
      $('pos').textContent = 'ビーコンを読めません。Android の Chrome で、chrome://flags の「Experimental Web Platform features」を有効にしてください。'; return;
    }
    $('b').textContent = '準備しています…';
    try { await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true }); }
    catch (e) { $('b').textContent = 'はじめる'; $('pos').textContent = 'ビーコンを読めません（' + e.message + '）'; return; }
    started = true; $('b').hidden = true;
    navigator.bluetooth.addEventListener('advertisementreceived', (ev) => {
      const k = keyOf(ev); if (!k || typeof ev.rssi !== 'number') return;
      const v = seen.get(k);
      seen.set(k, { ema: v ? v.ema * 0.8 + ev.rssi * 0.2 : ev.rssi, t: Date.now() });
    });
    setInterval(tick, 250);
  });
</script>
</body>
</html>
