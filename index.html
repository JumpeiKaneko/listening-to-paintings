<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>絵画を聴く</title>
<link rel="stylesheet" href="style.css">
<style>
  .test-corner { position: fixed; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 30;
    background: transparent; color: rgba(242,242,240,.32); border: 0;
    border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 11px; letter-spacing: .06em; cursor: pointer; }
  .test-corner.on { background: #F2F2F0; color: #111; }
  .test-panel { position: fixed; left: 12px; right: 12px; bottom: calc(44px + env(safe-area-inset-bottom)); z-index: 29;
    background: #1A1A1A; border: 1px solid rgba(255,255,255,.10); border-radius: 10px; padding: 14px 16px;
    font-size: 12px; max-height: 76svh; overflow-y: auto; }
  .test-panel .t-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .test-panel .t-now { color: #F2F2F0; font-weight: 500; font-size: 12.5px; }
  .test-panel .t-meta { color: #8E8E8A; font-size: 11px; margin-bottom: 10px; line-height: 1.5; font-family: 'Outfit', sans-serif; }
  .test-panel .t-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .test-panel .t-btn { background: rgba(255,255,255,.08); color: #F2F2F0; border: 0;
    border-radius: 8px; padding: 8px 6px; font: inherit; font-size: 11.5px; cursor: pointer; text-align: center; line-height: 1.35; }
  .test-panel .t-btn .t-db { display: block; font-size: 10.5px; color: #8E8E8A; font-family: 'Outfit', sans-serif; margin-top: 2px; }
  .test-panel .t-btn.on { background: #F2F2F0; color: #111; }
  .test-panel .t-btn.on .t-db { color: #555; }
  .test-panel .t-sl { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,.10); padding-top: 10px; }
  .test-panel .t-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .test-panel .t-row label { min-width: 96px; color: rgba(242,242,240,.78); font-size: 11.5px; }
  .test-panel .t-row input[type=range] { flex: 1; min-width: 110px; margin: 0; padding: 0; background: transparent; border: 0; accent-color: #F2F2F0; }
  .test-panel .t-val { min-width: 56px; text-align: right; font-family: 'Outfit', sans-serif; color: #F2F2F0; font-size: 11.5px; }
  .test-panel .t-mini { background: rgba(255,255,255,.12); color: #F2F2F0; border: 0; border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 10.5px; cursor: pointer; white-space: nowrap; }
  .test-panel .t-mini:active { background: #F2F2F0; color: #111; }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="bar"><span class="brand" id="brand">絵画を聴く</span></div>
<main class="stage">
  <!-- はじめる前／探しているあいだ -->
  <section class="seek" id="seek">
    <div class="radar" id="radar" hidden><i></i></div>
    <button id="b" class="play" aria-label="はじめる"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
    <p class="msg" id="msg" role="status" aria-live="polite">イヤホンをつけて、はじめる</p>
  </section>

  <!-- 絵の前 -->
  <section class="art" id="art" hidden>
    <p class="cap" id="caption"></p>
  </section>
  <section class="ctl" id="controls" hidden>
    <p id="st" class="state" role="status" aria-live="polite"></p>
    <button id="g" class="play" aria-label="ガイドを聴く"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
    <p class="state" id="g-label">ガイド</p>
  </section>

  <!-- 設営のとき（設定ボタン／index.html?setup） -->
  <section class="setup" id="setup" hidden>
    <h2>ビーコンの設定</h2>
    <p class="muted">「はじめる」を押すと、見えているビーコンの強さが下に出ます。</p>
    <table class="bt" id="map"></table>
    <p style="margin-top:12px">切り替わり <input class="th" id="th-near" type="number">dBm ／ 正面 <input class="th" id="th-stop" type="number">dBm が <input class="th" id="th-hold" type="number">秒</p>
    <table class="bt" id="seen"></table>
    <p class="debug" id="pos"></p>
    <p><button id="log" class="sbtn">記録を保存（CSV）</button> <button id="clear" class="sbtn">記録を消す</button></p>
  </section>
  <p style="text-align:center;margin-top:18px"><button class="link" id="toggle">設定</button></p>
</main>

<!-- 右下の控えめなデモテスト -->
<div class="test-panel" id="test-panel" hidden>
  <div class="t-head">
    <span class="t-now" id="test-now">テスト待機中（ビーコンを近づけるか下をタップ）</span>
    <button type="button" class="t-mini" id="test-stop">音オフ</button>
  </div>
  <div class="t-meta" id="test-meta">状態：待機　｜　最強：なし</div>
  <div class="t-btns" id="test-btns"></div>
  <div class="t-sl">
    <div class="t-row">
      <label>切り替わり（鳴り始め）</label>
      <input type="range" id="ts-near" min="-90" max="-35" step="1">
      <span class="t-val" id="tv-near">-64 dBm</span>
      <button type="button" class="t-mini" id="tb-near">今の距離</button>
    </div>
    <div class="t-row">
      <label>正面（はっきり）</label>
      <input type="range" id="ts-stop" min="-80" max="-25" step="1">
      <span class="t-val" id="tv-stop">-54 dBm</span>
      <button type="button" class="t-mini" id="tb-stop">今の距離</button>
    </div>
    <div class="t-row">
      <label>正面判定の秒数</label>
      <input type="range" id="ts-hold" min="0.5" max="4" step="0.5">
      <span class="t-val" id="tv-hold">1 秒</span>
    </div>
    <div class="t-row">
      <label>隣への切替余裕</label>
      <input type="range" id="ts-hyst" min="0" max="10" step="1">
      <span class="t-val" id="tv-hyst">+3 dBm</span>
    </div>
  </div>
</div>
<button type="button" class="test-corner" id="test-toggle">テスト</button>

<script src="exhibit.js"></script>
<script>
  // 歩いてまわる（シンプル安定版）：
  // ビーコンの強さ（-64 dBm〜）で近くの絵を検出し、完成版ミックス（mp3/<id>.mp3）を滑らかにクロスフェード再生する。
  // ガイドボタンで音声ガイド（mp3/ad1〜6.mp3）を再生し、再生中は背景音を自動で下げる。
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  const IBEACON = 0x004C, EDDYSTONE = '0000feaa-0000-1000-8000-00805f9b34fb';
  const hex = (dv, a, b) => { let s = ''; for (let i = a; i < b; i++) s += dv.getUint8(i).toString(16).padStart(2, '0'); return s; };
  const SCALE = [
    { note: 'ド', freq: 261.63 },
    { note: 'レ', freq: 293.66 },
    { note: 'ミ', freq: 329.63 },
    { note: 'ファ', freq: 349.23 },
    { note: 'ソ', freq: 392.00 },
    { note: 'ラ', freq: 440.00 }
  ];
  const AD = {
    'monet-beach-sainte-adresse-1867': 1,
    'pissarro-boulevard-montmartre-winter-1897': 2,
    'monet-gare-saint-lazare-1877': 3,
    'monet-stacks-of-wheat-1890': 4,
    'degas-dance-class-1874': 5,
    'caillebotte-paris-street-rainy-day-1877': 6
  };
  let lastStatus = '';
  const status = (s, txt) => {
    const key = s + '|' + txt; if (key === lastStatus) return; lastStatus = key;
    if (s === 'seek' || s === 'error') {
      $('seek').hidden = false; $('art').hidden = true; $('controls').hidden = true;
      $('radar').hidden = s === 'error' || !$('b').hidden;
      $('msg').innerHTML = txt;
      $('backdrop').classList.remove('on');
    } else {
      $('seek').hidden = true; $('art').hidden = false; $('controls').hidden = false;
      $('st').innerHTML = txt;
    }
  };
  let lock = null;
  const keepAwake = async () => { try { if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch (e) { } };
  document.addEventListener('visibilitychange', () => { if (lock && document.visibilityState === 'visible') keepAwake(); });

  function keyOf(ev) {
    const md = ev.manufacturerData && ev.manufacturerData.get(IBEACON);
    if (md && md.byteLength >= 23 && md.getUint8(0) === 0x02 && md.getUint8(1) === 0x15) return 'iBeacon ' + md.getUint16(18) + '-' + md.getUint16(20);
    const sd = ev.serviceData && ev.serviceData.get(EDDYSTONE);
    if (sd && sd.byteLength >= 18 && sd.getUint8(0) === 0x00) return 'Eddystone ' + hex(sd, 12, 18);
    if (ev.device && ev.device.name) return '名前 ' + ev.device.name;
    return null;
  }

  Exhibit.load().then(async (d) => {
    const works = d.works.filter((w) => w.files.work);
    let map = {};
    // KBPro のデバイス名（KBPro_000, B〜G）と iBeacon 番号の両方で反応するように登録
    const DEFAULT_BEACONS = {
      '名前 KBPro_000': 'monet-beach-sainte-adresse-1867',
      '名前 KBPro_B': 'pissarro-boulevard-montmartre-winter-1897',
      '名前 KBPro_C': 'monet-gare-saint-lazare-1877',
      '名前 KBPro_D': 'monet-stacks-of-wheat-1890',
      '名前 KBPro_F': 'degas-dance-class-1874',
      '名前 KBPro_G': 'caillebotte-paris-street-rainy-day-1877',
      'iBeacon 9-48399': 'monet-beach-sainte-adresse-1867',
      'iBeacon 9-50449': 'pissarro-boulevard-montmartre-winter-1897',
      'iBeacon 9-48394': 'monet-gare-saint-lazare-1877',
      'iBeacon 9-48409': 'monet-stacks-of-wheat-1890',
      'iBeacon 9-50448': 'degas-dance-class-1874',
      'iBeacon 9-48232': 'caillebotte-paris-street-rainy-day-1877'
    };
    Object.entries(DEFAULT_BEACONS).forEach(([k, id]) => { map[k] = id; });
    works.forEach((w) => { if (w.beacon && !map[w.beacon]) map[w.beacon] = w.id; });

    const th = Object.assign({ near: -64, stop: -54, hold: 1.0, hyst: 3 }, store.get('beaconTh_v2', {}));
    const log = store.get('beaconLog', []);
    const seen = new Map();
    const rssiOf = (id, now, maxAge) => {
      let best = null;
      for (const [k, v] of seen) if (map[k] === id && now - v.t < maxAge && (best === null || v.ema > best)) best = v.ema;
      return best;
    };

    // ---- 2系統の <audio> による滑らかなクロスフェード再生 ----
    const bgA = new Audio(), bgB = new Audio();
    bgA.loop = bgB.loop = true;
    bgA.preload = bgB.preload = 'auto';
    let bg = bgA;
    const guide = new Audio();
    guide.preload = 'auto';
    let guiding = false;

    const FADE_MS = 1400;
    const DUCK = 0.28;
    const BG_MIN = 0.35;
    const BG_MAX = 0.95;

    function ramp(a, to, ms, done) {
      clearInterval(a._r);
      const from = a.volume;
      const dst = clamp(to, 0, 1);
      if (ms <= 0 || Math.abs(dst - from) < 0.005) {
        a.volume = dst;
        if (done) done();
        return;
      }
      const t0 = performance.now();
      a._r = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        a.volume = clamp(from + (dst - from) * k, 0, 1);
        if (k >= 1) { clearInterval(a._r); if (done) done(); }
      }, 40);
    }

    let started = false, prox = 0;
    let cur = null, state = null, stopSince = 0, leaveSince = 0;
    let candId = null, candCount = 0;
    const setupMode = () => !$('setup').hidden;
    const wOf = (id) => works.find((w) => w.id === id);
    const condOf = (id) => Exhibit.condition(d, d.works.findIndex((w) => w.id === id));

    function bgTarget() {
      if (!cur || testMode) return 0;
      const c = condOf(cur);
      if (c === 'picture' || c === 'guide') return 0;
      const base = BG_MIN + (BG_MAX - BG_MIN) * clamp(prox, 0, 1);
      return guiding ? Math.min(base, DUCK) : base;
    }

    function stopAllBg(ms) {
      [bgA, bgB].forEach((a) => {
        if (!a.paused) ramp(a, 0, ms, () => { a.pause(); });
        else { clearInterval(a._r); a.volume = 0; }
      });
    }

    // ---- しきい値UI同期 ----
    function syncThUI() {
      $('th-near').value = th.near; $('th-stop').value = th.stop; $('th-hold').value = th.hold;
      $('ts-near').value = th.near; $('tv-near').textContent = th.near + ' dBm';
      $('ts-stop').value = th.stop; $('tv-stop').textContent = th.stop + ' dBm';
      $('ts-hold').value = th.hold; $('tv-hold').textContent = th.hold + ' 秒';
      $('ts-hyst').value = th.hyst; $('tv-hyst').textContent = '+' + th.hyst + ' dBm';
    }
    syncThUI();
    function setTh(k, v) { th[k] = Number(v); store.set('beaconTh_v2', th); syncThUI(); }
    ['near', 'stop', 'hold'].forEach((k) => $('th-' + k).addEventListener('change', (e) => setTh(k, e.target.value)));
    ['near', 'stop', 'hold', 'hyst'].forEach((k) => $('ts-' + k).addEventListener('input', (e) => setTh(k, e.target.value)));

    // ---- 右下テストモード ----
    let testMode = false, testCtx = null, testOsc = null, testGain = null, testActiveId = null;
    function ensureTestAudio() {
      if (!testCtx) { const AC = window.AudioContext || window.webkitAudioContext; testCtx = new AC({ latencyHint: 'playback' }); }
      if (testCtx.state !== 'running') testCtx.resume().catch(() => { });
      if (!testOsc) {
        testOsc = testCtx.createOscillator();
        testOsc.type = 'sine';
        testGain = testCtx.createGain();
        testGain.gain.value = 0;
        testOsc.connect(testGain);
        testGain.connect(testCtx.destination);
        testOsc.start();
      }
      return testCtx;
    }
    function strongestMapped() {
      const now = Date.now();
      let best = null;
      for (const [k, v] of seen) if (map[k] && now - v.t < 4000 && (!best || v.ema > best.ema)) best = { id: map[k], key: k, ema: v.ema };
      return best;
    }
    function updateTestDisplay() {
      if (!testMode) return;
      const now = Date.now();
      const stNames = { walk: '歩く（無音）', near: '切り替わり', stop: '正面', leave: '離れる' };
      const best = strongestMapped();
      const bestW = best ? wOf(best.id) : null;
      const bestTxt = best && bestW ? `${bestW.beaconLabel || ''} ${Math.round(best.ema)}dBm` : (started ? '受信なし' : '未開始');
      $('test-meta').textContent = `状態：${stNames[state] || '待機'}　｜　最強：${bestTxt}　｜　接近 ${Math.round(prox * 100)}%`;
      [...$('test-btns').children].forEach((btn) => {
        const ema = rssiOf(btn.dataset.id, now, 4000);
        const db = ema !== null ? Math.round(ema) + ' dBm' : '--';
        const span = btn.querySelector('.t-db');
        if (span) span.textContent = db;
        btn.classList.toggle('on', btn.dataset.id === testActiveId);
      });
    }
    function playTestTone(id, st, rssi) {
      const idx = works.findIndex((w) => w.id === id);
      if (idx < 0) return;
      const sc = SCALE[idx % SCALE.length];
      const w = works[idx];
      const ctx = ensureTestAudio();
      const apply = () => {
        const t = ctx.currentTime;
        const vol = st === 'walk' ? 0 : (0.08 + 0.42 * prox);
        testOsc.frequency.cancelScheduledValues(t);
        testGain.gain.cancelScheduledValues(t);
        testOsc.frequency.setValueAtTime(sc.freq, t);
        testGain.gain.setTargetAtTime(vol, t, 0.04);
        testActiveId = vol > 0 ? id : null;
        const lbl = w.beaconLabel ? w.beaconLabel + ' ' : '';
        const stName = { walk: '歩く', near: '切り替わり', stop: '正面', leave: '離れる' }[st] || st;
        $('test-now').textContent = `${lbl}${sc.note}（${Math.round(sc.freq)}Hz）｜${stName}${rssi != null ? ' ' + Math.round(rssi) + ' dBm' : ''}`;
        updateTestDisplay();
      };
      if (ctx.state !== 'running') ctx.resume().then(apply).catch(apply);
      else apply();
    }
    function muteTestTone() {
      if (testGain && testCtx) {
        const t = testCtx.currentTime;
        testGain.gain.cancelScheduledValues(t);
        testGain.gain.setTargetAtTime(0, t, 0.04);
      }
      testActiveId = null;
      $('test-now').textContent = 'テスト待機中（ビーコンを近づけるか下をタップ）';
      updateTestDisplay();
    }
    $('test-btns').innerHTML = works.map((w, idx) => {
      const sc = SCALE[idx % SCALE.length];
      const lbl = w.beaconLabel || String(idx + 1);
      return `<button type="button" class="t-btn" data-id="${Exhibit.esc(w.id)}">${Exhibit.esc(lbl)} ${sc.note}<span class="t-db">--</span></button>`;
    }).join('');
    $('test-btns').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-id]'); if (!btn) return;
      const id = btn.dataset.id;
      cur = id; state = 'stop'; prox = 1; show(id); status('stop', '');
      playTestTone(id, 'stop', null);
    });
    $('test-stop').addEventListener('click', muteTestTone);
    $('tb-near').addEventListener('click', () => {
      const b = strongestMapped(); if (!b) { $('test-now').textContent = '先に「はじめる」を押してビーコンを受信してください'; return; }
      setTh('near', Math.round(b.ema));
      $('test-now').textContent = `「切り替わり」を今の距離（${Math.round(b.ema)} dBm）にしました`;
    });
    $('tb-stop').addEventListener('click', () => {
      const b = strongestMapped(); if (!b) { $('test-now').textContent = '先に「はじめる」を押してビーコンを受信してください'; return; }
      const v = Math.round(b.ema) - 3;
      setTh('stop', v);
      $('test-now').textContent = `「正面」を今の距離-3（${v} dBm）にしました`;
    });
    $('test-toggle').addEventListener('click', () => {
      testMode = !testMode;
      $('test-toggle').classList.toggle('on', testMode);
      $('test-panel').hidden = !testMode;
      if (testMode) {
        stopAllBg(300); stopGuide();
        ensureTestAudio();
        if (cur) playTestTone(cur, state || 'near', null);
        updateTestDisplay();
      } else {
        muteTestTone();
        cur = null; state = null;
        if (started) status('seek', '絵に近づいてください');
      }
    });

    // ---- 設定画面 ----
    $('toggle').addEventListener('click', (e) => { e.preventDefault(); $('setup').hidden = !$('setup').hidden; });
    if (new URLSearchParams(location.search).has('setup')) $('setup').hidden = false;
    function renderMap() {
      $('map').innerHTML = '<tr><th>絵</th><th>ビーコン</th><th></th></tr>' + works.map((w) => {
        const ks = Object.keys(map).filter((b) => map[b] === w.id);
        const k = ks.find((b) => b.startsWith('名前 ')) || ks[0] || '（なし）';
        const tag = w.beaconLabel ? `[${w.beaconLabel}] ` : '';
        return `<tr><td>${Exhibit.esc(tag + w.title)}</td><td>${Exhibit.esc(k)}</td><td></td></tr>`;
      }).join('');
    }
    renderMap();
    $('log').addEventListener('click', () => {
      const csv = 'time,work,state\n' + log.map((r) => [r.time, r.work, r.state].join(',')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'beacon-log-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    });
    $('clear').addEventListener('click', () => { if (confirm('記録を消しますか？')) { log.length = 0; store.set('beaconLog', log); } });

    // ---- ガイド再生 ----
    const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
    const STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>';
    function paintGuideBtn() {
      $('g').innerHTML = guiding ? STOP : PLAY;
      $('g').dataset.on = guiding ? '1' : '';
      $('g-label').textContent = guiding ? 'ガイドを止める' : 'ガイドを聴く';
    }
    function stopGuide() {
      guide.pause();
      guiding = false;
      paintGuideBtn();
      if (cur && !testMode && !bg.paused) ramp(bg, bgTarget(), 700);
    }
    function startGuide() {
      if (!cur || !guide.src) return;
      guiding = true;
      paintGuideBtn();
      if (guide.ended) guide.currentTime = 0;
      const p = guide.play();
      if (p && p.catch) {
        p.catch(() => {
          if (guide.dataset.fallback && guide.src.indexOf(guide.dataset.fallback) < 0) {
            guide.src = guide.dataset.fallback;
            guide.dataset.fallback = '';
            guide.load();
            guide.play().catch(() => { stopGuide(); });
          } else {
            stopGuide();
          }
        });
      }
      if (!bg.paused) ramp(bg, bgTarget(), 600);
      record('guide');
    }
    guide.addEventListener('ended', stopGuide);
    guide.addEventListener('error', () => {
      if (guiding && guide.dataset.fallback) {
        guide.src = guide.dataset.fallback;
        guide.dataset.fallback = '';
        guide.load();
        guide.play().catch(() => { stopGuide(); });
      } else if (guiding) {
        stopGuide();
      }
    });
    $('g').addEventListener('click', () => { if (guiding) stopGuide(); else startGuide(); });

    // ---- 作品の切り替え ----
    function record(s) { log.push({ time: new Date().toISOString(), work: cur || '', state: s }); store.set('beaconLog', log); }
    function show(id) {
      const w = wOf(id);
      const tag = w.beaconLabel ? `[${w.beaconLabel}] ` : '';
      $('caption').innerHTML = `<span class="ti">${Exhibit.esc(tag + w.title)}</span><span class="ar">${Exhibit.esc(w.artist)}　${Exhibit.esc(w.year || '')}</span>`;
      if (w.files.image) {
        $('backdrop').style.backgroundImage = `url("${w.files.image}")`;
        $('backdrop').classList.add('on');
      }
    }
    function enter(id, rssi) {
      if (testMode) {
        cur = id; state = 'near'; stopSince = 0; leaveSince = 0;
        if (typeof rssi === 'number') prox = clamp((rssi - th.near) / Math.max(8, (th.stop + 8) - th.near), 0.2, 1);
        show(id); status('near', '');
        playTestTone(id, 'near', rssi);
        return;
      }
      cur = id; state = 'near'; stopSince = 0; leaveSince = 0;
      prox = typeof rssi === 'number' ? clamp((rssi - th.near) / Math.max(8, (th.stop + 8) - th.near), 0.25, 1) : 0.6;
      stopGuide();

      const c = condOf(id);
      show(id);
      $('g').hidden = (c === 'picture');
      $('g-label').hidden = (c === 'picture');

      const adPath = AD[id] ? 'mp3/ad' + AD[id] + '.mp3' : '';
      const wavFallback = 'works/' + id + '/voice/guide.wav';
      guide.src = adPath || wavFallback;
      guide.dataset.fallback = adPath ? wavFallback : '';
      guide.currentTime = 0;
      guide.load();

      if (c === 'picture') {
        stopAllBg(800);
        status('near', 'この絵は、音なしでご覧ください');
        record('near');
        return;
      }

      status('near', '');
      if (c === 'guide') {
        stopAllBg(800);
      } else {
        const old = bg;
        const next = (bg === bgA) ? bgB : bgA;
        clearInterval(next._r);
        next.src = 'mp3/' + id + '.mp3';
        next.volume = 0;
        next.currentTime = 0;
        next.play().catch(() => { });
        ramp(next, bgTarget(), FADE_MS);
        if (old !== next && !old.paused) ramp(old, 0, FADE_MS, () => { old.pause(); });
        bg = next;
      }
      record('near');
    }

    function setState(s, rssi) {
      if (testMode) {
        if (s !== state) { state = s; }
        if (cur) playTestTone(cur, s, rssi);
        return;
      }
      if (s === state) return;
      state = s; record(s);
      if (s === 'walk') {
        stopGuide();
        stopAllBg(1200);
        cur = null; prox = 0;
        status('seek', '絵に近づいてください');
        return;
      }
      if (condOf(cur) === 'picture') return;
      if (s === 'leave') status('leave', '次の絵へ');
      else status(s, '');
    }

    // 0.25秒ごとに最も近い絵を判定して滑らかに切り替える
    function tick() {
      const now = Date.now();
      let best = null;
      for (const [k, v] of seen) {
        if (map[k] && now - v.t < 3000 && v.ema > th.near && (!best || v.ema > best.ema)) {
          best = { id: map[k], ema: v.ema };
        }
      }
      const curE = cur ? ((() => { const r = rssiOf(cur, now, 3000); return r !== null ? r : -120; })()) : -120;

      if (best && best.id !== cur) {
        if (!cur || curE <= th.near || best.ema >= curE + (Number(th.hyst) || 0)) {
          candCount = candId === best.id ? candCount + 1 : 1;
          candId = best.id;
          if (!cur || candCount >= 2) {
            candId = null; candCount = 0;
            enter(best.id, best.ema);
            return;
          }
        } else { candId = null; candCount = 0; }
      } else { candId = null; candCount = 0; }

      if (!cur) {
        prox = prox * 0.7;
        status('seek', '絵に近づいてください');
        updateTestDisplay();
        return;
      }

      const targetProx = clamp((curE - th.near) / Math.max(8, (th.stop + 8) - th.near), 0, 1);
      prox = prox * 0.6 + targetProx * 0.4;

      if (curE > th.stop) {
        leaveSince = 0;
        if (!stopSince) stopSince = now;
        setState(now - stopSince >= th.hold * 1000 ? 'stop' : 'near', curE);
      } else if (curE > th.near) {
        stopSince = 0; leaveSince = 0;
        setState('near', curE);
      } else {
        stopSince = 0;
        if (!leaveSince) leaveSince = now;
        setState(now - leaveSince > 3500 ? 'walk' : 'leave', curE);
      }

      if (!testMode && cur && !bg.paused && !bg._r) {
        const dst = bgTarget();
        bg.volume = clamp(bg.volume + (dst - bg.volume) * 0.2, 0, 1);
      }
      if (setupMode()) {
        const names = { walk: '歩く', near: '切り替わり', stop: '正面', leave: '離れる' };
        $('pos').textContent = `${names[state] || '—'}　現在 ${Math.round(curE)} dBm　接近 ${Math.round(prox * 100)}%`;
      }
      updateTestDisplay();
    }

    // ---- はじめる ----
    $('b').addEventListener('click', async () => {
      if (started) return;
      // タップの瞬間に全<audio>の再生許可を取る
      [bgA, bgB, guide].forEach((a) => {
        a.muted = true;
        a.play().then(() => { a.pause(); a.muted = false; }).catch(() => { a.muted = false; });
      });
      const scan = navigator.bluetooth && navigator.bluetooth.requestLEScan
        ? navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true }).catch((e) => ({ error: e }))
        : Promise.resolve({ error: new Error('unsupported') });
      $('b').disabled = true; $('msg').textContent = '準備しています';
      const s = await scan;
      if (s && s.error) {
        $('b').disabled = false;
        status('error', 'このスマホでは使えません<br>会場のスマホをお使いください');
        $('pos').textContent = '（スタッフ向け）Android の Chrome で chrome://flags の「Experimental Web Platform features」を有効にし、https のページで開いてください。' + s.error.message;
        return;
      }
      navigator.bluetooth.addEventListener('advertisementreceived', (ev) => {
        const k = keyOf(ev); if (!k || typeof ev.rssi !== 'number') return;
        const now = Date.now(), v = seen.get(k);
        const buf = v && now - v.t < 3000 ? v.buf.concat(ev.rssi).slice(-3) : [ev.rssi];
        const sorted = buf.slice().sort((a, b) => a - b);
        const med = sorted[Math.floor(sorted.length / 2)];
        const ema = v && now - v.t < 3000 ? v.ema * 0.55 + med * 0.45 : med;
        seen.set(k, { ema, buf, t: now });
      });
      started = true; keepAwake();
      $('b').hidden = true;
      $('brand').classList.add('live');
      status('seek', '絵に近づいてください');
      setInterval(() => {
        tick();
        if (setupMode()) {
          $('seen').innerHTML = [...seen.entries()]
            .filter(([, v]) => Date.now() - v.t < 5000)
            .sort((a, b) => b[1].ema - a[1].ema)
            .slice(0, 10)
            .map(([k, v]) => `<tr><td>${Exhibit.esc(k)}</td><td>${Math.round(v.ema)} dBm</td><td>${map[k] ? Exhibit.esc((wOf(map[k]) || {}).title || '') : ''}</td></tr>`)
            .join('');
        }
      }, 250);
    });
  });
</script>
</body>
</html>
